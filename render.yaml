services:
  - type: web
    name: annanazar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn notifications:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NAZAR_PASSWORD
        sync: false
      - key: ANNA_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://hudaynazar250406.github.io
