name: Create Android signing key
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create encrypted signing key
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          test "${#PASS}" -ge 20 || (echo 'Secret SIGNING_PASSPHRASE must contain at least 20 characters' && exit 1)
          test ! -f android-signing/debug.keystore.enc || (echo 'Signing key already exists' && exit 1)
          mkdir -p android-signing
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in /tmp/debug.keystore -out android-signing/debug.keystore.enc -pass env:PASS
          rm -f /tmp/debug.keystore
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add android-signing/debug.keystore.enc
          git commit -m 'chore: add encrypted Android signing key'
          git push
